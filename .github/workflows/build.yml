name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'list.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RemixWidget.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest RemixWidget.apk --repo "$GITHUB_REPOSITORY" --title "최신 APK" --notes "휴대폰에서 RemixWidget.apk 를 내려받아 설치하세요. (빌드 ${GITHUB_SHA::7})"
